<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Star Wars API</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Star Wars</h1>
        <p>Consultas de películas de Star Wars</p>

        <div class="search-box">
            <input type="number" id="numPelicula" min="1" max="6" placeholder="Número (1-6)">
            <button id="btnConsultar">Consultar</button>
        </div>

        <div id="resultado" class="hidden">
            <h2 id="titulo"></h2>
            <p><strong>Episodio:</strong> <span id="episodio"></span></p>
            <p><strong>Director:</strong> <span id="director"></span></p>
            <p><strong>Estreno:</strong> <span id="fecha"></span></p>
            <div class="crawl" id="crawl"></div>
        </div>
        
        <div id="error" class="error hidden"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
